[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rainfall-trends"
version = "5.0.0"
description = "Fail-closed, reusable rainfall trend analysis with MK-family sensitivity methods"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.5",
  "pandas==3.0.1",
  "scipy==1.16.3",
  "matplotlib==3.10.8",
  "python-docx==1.2.0",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pymannkendall==1.4.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
