# ETCCDI Phitsanulok Pipeline Configuration
# Station: WMO 48378 | ID: 378201 | Phitsanulok, Thailand

# ─── Paths ─────────────────────────────────────────────────────────────────
paths:
  raw_data: "C:/MyPython/2Station/Observed_Rain_daily_complete_1961_2019_378201_wmo48378_Phitsanulok.csv"
  output_root: "output"
  audit_dir: "audit"

# ─── Station Metadata ───────────────────────────────────────────────────────
station:
  id: 378201
  wmo_id: 48378
  name: "Phitsanulok"
  province: "Phitsanulok"
  country: "Thailand"
  latitude_deg_N: 16.78
  longitude_deg_E: 100.27
  elevation_m: 45

# ─── Study Period ───────────────────────────────────────────────────────────
period:
  start_year: 1961
  end_year: 2019
  n_years: 59

# ─── Baseline for Percentile Indices ────────────────────────────────────────
baseline:
  start_year: 1981
  end_year: 2010

# ─── ETCCDI Thresholds ──────────────────────────────────────────────────────
etccdi:
  wet_day_threshold_mm: 1.0   # P >= 1.0 mm = wet day
  r10_threshold_mm: 10.0
  r20_threshold_mm: 20.0
  r50_threshold_mm: 50.0
  completeness_threshold: 0.90  # min fraction of days for valid annual index
  suspect_value_mm: 500.0        # flag but do not remove

# ─── Trend Analysis ─────────────────────────────────────────────────────────
trend:
  alpha: 0.05
  acf_significance_factor: 2.0   # |r_k| > factor/sqrt(N) = significant
  acf_max_lag: 10
  mk_method_autocorrelated: "hamed_rao"   # options: hamed_rao, yue_wang
  sen_slope_ci: 0.95

# ─── Multiple Testing ────────────────────────────────────────────────────────
multiple_testing:
  method: "fdr_bh"   # Benjamini–Hochberg FDR
  alpha: 0.05

# ─── Figure Settings ─────────────────────────────────────────────────────────
figures:
  dpi: 300
  format: "png"
  font_family: "DejaVu Serif"
  font_size_label: 10
  font_size_tick: 8
  font_size_title: 11
  figure_width_single: 8.27    # A4 width in inches
  figure_width_double: 6.93    # journal double column
  linewidth: 1.0
  trend_line_color: "#c0392b"
  ci_fill_alpha: 0.15
  data_color: "#2c3e50"
  significant_marker: "**"
  ns_marker: "ns"
